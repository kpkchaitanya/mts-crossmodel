version: "1.0"
project:
  name: "MTS Testing System"
  timezone: "America/New_York"
calendar:
  # Shared school-year week numbering for the `week=<n>` command parameter.
  # week_1_start must be a Monday; week N start = week_1_start + 7*(N-1) days.
  school_year: "2026-2027"
  week_1_start: "2026-08-17"
question_design:
  # Shared 6-point ordinal scale for the /generate-worksheet `difficulty` and `diversity`
  # parameters; see subjects/math/src/question_plan.py for the level -> behavior mapping.
  levels: ["low", "low_plus", "medium", "medium_plus", "high", "very_high"]
  difficulty:
    default: "medium_plus"
  diversity:
    default: "medium_plus"
  form_diversity:
    default: "high"
    seed_strategy: "generated_per_run"
    allow_run_seed_override: true
    activation: "profiled_topics_only"
governance:
  instruction_precedence: ["current_user", "constitution", "config", "requirements", "design"]
artifacts:
  worksheet_spec_required: true
  derive_worksheet_and_key_from_same_spec: true
verification:
  verify_every_item: true
  reverify_after_edits: true
  block_render_on_required_failure: true
formatting:
  print_friendly: true
  editable_google_docs: true
  minimize_excess_whitespace: true
  visual_qa_required: true
  # Configurable rounding for numeric answer-key display (does not affect stored/verified answers).
  # Only applied when a float's raw value has more than answer_rounding_noise_threshold decimal
  # digits (e.g. floating-point noise like 3.9999999999999996); clean short decimals are untouched.
  answer_decimal_places: 2
  answer_rounding_noise_threshold: 3
publishing:
  require_configured_final_gate: true
  # Default for the /generate-worksheet `publish` parameter; explicit `publish=no` overrides per run.
  default_publish: true
  # Staging holds work-in-progress and post-Gate-5 approved artifacts; it is never the audience-facing
  # location. Final Delivery copies approved artifacts into per-grade parent folders visible to parents.
  staging:
    render_folder_id: "1FUZ5hC4hpKEZwirG-p4bKpDlPiN8IBfL"
    approved_folder_id: "1OncoWGkuBzmDDMURq6P9WsJ_ycnRmlXS"
  final_delivery:
    enabled: true
    # Default for the /generate-worksheet `deliver` parameter; explicit `deliver=no` overrides per run.
    default_deliver: true
    audience: "parents"
    requires_gate: "publish_approval"
    # {{WEEK_OF}} resolves to the ISO Monday of the delivered instructional week.
    week_folder_pattern: "Week_{{WEEK_OF}}"
    reuse_existing_week_folder: true
    # copy keeps staging intact as the audit trail; move would empty staging on delivery.
    mode: "copy"
    deliver_answer_key: true
  # Housekeeping utility: moves the previous set's loose files into an Archive child folder so a
  # target folder presents only the current set. Never renders, edits, deletes, or approves anything.
  archive:
    enabled: true
    archive_folder_name: "Archive"
    # Presets reference canonical destination keys; folder IDs are never duplicated here.
    targets:
      staging:
        folder_type: "folder"
        source: "publishing.staging.approved_folder_id"
      publish:
        folder_type: "parent"
        source: "publishing.final_delivery.destinations_by_grade"
        default_folder_date: "latest"
    # Automatic in-pipeline archiving; off until the hooks are separately designed and approved.
    auto_archive:
      before_render: false
      before_delivery: false
  # Destructive companion to archive: trashes files instead of moving them. Trash only, never a
  # permanent delete, so a mistaken run stays recoverable from Drive Trash.
  cleanup:
    # Enabled 2026-09-03 after review. Setting this false is the kill switch for the whole utility.
    enabled: true
    default_scope: "files"
    require_confirmation: true
    # Presets reference the same canonical destination keys as publishing.archive.targets.
    targets:
      staging:
        folder_type: "folder"
        source: "publishing.staging.approved_folder_id"
      publish:
        folder_type: "parent"
        source: "publishing.final_delivery.destinations_by_grade"
        default_folder_date: "latest"
telemetry:
  runs_root: "runs"
  unavailable_authoritative_values: null
gates:
  default: "all"
  # ids and forward transitions must match src/runtime/gates.py GATES exactly.
  definitions:
    - {id: "scope_review", name: "Gate 1: Curriculum Scope Review", advances_to: "worksheet_prepared"}
    - {id: "question_review", name: "Gate 2: Question Review", advances_to: "verification_in_progress"}
    - {id: "verification_review", name: "Gate 3: Verification Review", advances_to: "render_ready"}
    - {id: "formatting_review", name: "Gate 4: Formatting Review", advances_to: "publish_approval_pending"}
    - {id: "publish_approval", name: "Gate 5: Publish Approval", advances_to: "published"}
  bypass:
    allowed: true
    requires_explicit_current_user_instruction: true
    silent_bypass_prohibited: true
    record_in_run_manifest: true
    # Bypassing a gate only removes its stop-and-approve checkpoint; it never
    # waives the requirements below, which stay enforced by artifacts/verification/formatting.
    non_bypassable_requirements:
      - "artifacts.worksheet_spec_required"
      - "verification.verify_every_item"
      - "verification.reverify_after_edits"
      - "formatting.visual_qa_required"

