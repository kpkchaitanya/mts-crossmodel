version: "1.0"
worksheet_type_id: "weekly-worksheet"
display_name: "Weekly Worksheet"
status: "active"
compatible_subjects: ["math"]
sections:
  - {id: "monday", title: "Foundation"}
  - {id: "tuesday", title: "Discover"}
  - {id: "wednesday", title: "Practice"}
  - {id: "thursday", title: "Apply and Review"}
  - {id: "friday", title: "Mastery"}
grade_defaults:
  grade_1: {questions_per_day: 10, question_count: 50}
  grade_4: {questions_per_day: 10, question_count: 50}
  grade_5: {questions_per_day: 10, question_count: 50}
  grade_6: {questions_per_day: 8, question_count: 40}
  grade_9_10: {questions_per_day: 5, question_count: 50, grade_split: {math_1: 25, math_2: 25}}
duration_minutes: null
template_selection:
  template_manifest: "subjects/math/config/template-manifest.json"
  template_key_by_grade:
    grade_1: "grade_1_class"
    grade_4: "standard_class"
    grade_5: "standard_class"
    grade_6: "standard_class"
    grade_9_10: "high_school_combined"
validation:
  require_verification: true
  require_visual_qa: true
extension_readiness:
  regression_baseline: "subjects/math/tests/test_subject_module.py"
  template_fallback: "Existing approved Class Worksheet templates are used until dedicated Weekly templates are approved."